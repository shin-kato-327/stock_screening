[project]
name = "stock-screening"
version = "0.1.0"
description = "Japan-equity value screen (net-cash ratio) + paper trading simulation"
requires-python = ">=3.12,<3.13"

dependencies = [
    "apache-airflow[postgres]==2.11.0",
    "arelle-release>=2.30",
    "sqlalchemy>=1.4.36,<2.0",  # pinned by Airflow 2.x; SA 2.0 lands in Airflow 3.x
    "alembic>=1.13",
    "pandas>=2.2",
    "requests>=2.31",
    "tenacity>=8.5",
    "psycopg2-binary>=2.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_screening"]

[tool.uv]
constraint-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

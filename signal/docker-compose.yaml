services:
  # signal-cli REST wrapper. Once linked to a Signal account, accepts
  # POST requests to send messages and exposes minimal management
  # endpoints. We never expose this beyond localhost on the host.
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    restart: unless-stopped
    environment:
      MODE: normal       # 'normal' (vs 'json-rpc') is fine for our send-only use
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8090:8080"   # bind to loopback only — no LAN exposure
    volumes:
      - signal-data:/home/.local/share/signal-cli

volumes:
  signal-data:
